name: Python application

on:
  push:
    branches: [ "main", "task-2" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"

    - name: Install TA-Lib C Library
      run: |
        wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
        tar -xzf ta-lib-0.4.0-src.tar.gz
        cd ta-lib
        ./configure --prefix=/usr
        make
        sudo make install
        sudo ldconfig
        echo "--- Verifying install ---"
        ls /usr/lib/libta_lib* || echo "NOT FOUND in /usr/lib"
        ls /usr/include/ta_* || echo "NOT FOUND in /usr/include"
        sudo mkdir -p /usr/include/ta-lib
        sudo cp /usr/include/ta_*.h /usr/include/ta-lib/
        echo "--- Headers in /usr/include/ta-lib ---"
        ls /usr/include/ta-lib/

    - name: Install TA-Lib Python wrapper
      run: |
        python -m pip install --upgrade pip
        pip install numpy
        pip install TA-Lib==0.4.24 --no-build-isolation

    - name: Install remaining dependencies
      run: |
        pip install -r requirements.txt

    - name: Run Tests
      run: |
        pytest