name: Python application

on:
  push:
    branches: [ "main", "task-2" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"

    # THIS IS THE MISSING PIECE
    - name: Install TA-Lib C Library
      run: |
        wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
        tar -xzf ta-lib-0.4.0-src.tar.gz
        cd ta-lib/
        ./configure --prefix=/usr
        make
        sudo make install
        # This is the missing link: 
        # The wrapper looks for "ta-lib/ta_defs.h", so we ensure /usr/include/ta-lib exists
        sudo mkdir -p /usr/include/ta-lib
        sudo cp /usr/include/*.h /usr/include/ta-lib/ 2>/dev/null || true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 1. Install NumPy 1.x first to avoid the NPY_C_CONTIGUOUS error
        pip install "numpy<2.0.0"
        
        # 2. Tell the compiler exactly where the TA-Lib files are
        export TA_INCLUDE_PATH=/usr/include
        export TA_LIBRARY_PATH=/usr/lib
        
        # 3. Install TA-Lib with build isolation turned OFF 
        # This forces pip to use the environment we just set up
        pip install TA-Lib==0.4.24 --no-build-isolation
        
        # 4. Install the rest of your requirements
        pip install -r requirements.txt

    - name: Run Tests
      run: |
        pytest